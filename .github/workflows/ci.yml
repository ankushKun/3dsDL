name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  host-tests:
    name: Host tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libcurl4-openssl-dev zlib1g-dev libarchive-dev libzstd-dev

      # FAT ignores case and the archive tests check what 3dsDL does about
      # it, so they run in a folder that ignores case too, as macOS's do.
      - name: A temporary folder that ignores case, like the SD card
        run: |
          truncate -s 2G "$RUNNER_TEMP/casefold.img"
          mkfs.ext4 -q -O casefold "$RUNNER_TEMP/casefold.img"
          sudo mkdir -p /mnt/casefold
          sudo mount -o loop "$RUNNER_TEMP/casefold.img" /mnt/casefold
          sudo mkdir /mnt/casefold/tmp
          sudo chattr +F /mnt/casefold/tmp
          sudo chown "$(id -u):$(id -g)" /mnt/casefold/tmp
          echo "TMPDIR=/mnt/casefold/tmp" >> "$GITHUB_ENV"

      - name: Unit and integration tests (ASan + UBSan)
        run: make -C tests check

  build:
    name: 3DSX and CIA
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Build with the pinned toolchain
        run: ./scripts/build.sh
        env:
          THREEDSDL_BUILD_JOBS: 4

      - uses: actions/upload-artifact@v4
        with:
          name: 3dsDL-${{ github.sha }}
          path: dist/
          if-no-files-found: error

  release:
    name: Draft release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [host-tests, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: 3dsDL-${{ github.sha }}
          path: dist

      - name: Check that the tag matches VERSION
        run: |
          expected="v$(tr -d '[:space:]' < VERSION)"
          if [ "${GITHUB_REF_NAME}" != "${expected}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match VERSION (${expected})." >&2
            exit 1
          fi

      - name: Verify checksums
        run: cd dist && sha256sum -c 3dsDL.sha256

      # A release (v1.2.3) is created as a draft, so a maintainer can review
      # it before publishing. A pre-release (v1.2.3-beta.1) is for testers
      # and goes out at once: GitHub never calls a pre-release the latest,
      # so 3dsDL's updater does not offer it to anyone.
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          read -r _ _ _ kind < <(scripts/version.sh)
          if [ "${kind}" = "prerelease" ]; then
            stage=(--prerelease)
          else
            stage=(--draft)
          fi
          gh release create "${GITHUB_REF_NAME}" \
            dist/3dsDL.3dsx dist/3dsDL.cia dist/3dsDL.smdh dist/3dsDL.sha256 \
            dist/3dsDL.elf \
            --title "3dsDL ${GITHUB_REF_NAME}" \
            --generate-notes \
            "${stage[@]}"
